name: Publish Docker Images

on:
  push:
    branches:
      - develop
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ops-radar-backend
  FRONTEND_IMAGE_NAME: ops-radar-frontend

jobs:
  publish:
    name: Build and push GHCR images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image names
        id: images
        shell: bash
        run: |
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA="${GITHUB_SHA::12}"

          BACKEND_IMAGE="${REGISTRY}/${OWNER_LC}/${BACKEND_IMAGE_NAME}"
          FRONTEND_IMAGE="${REGISTRY}/${OWNER_LC}/${FRONTEND_IMAGE_NAME}"

          {
            echo "owner_lc=${OWNER_LC}"
            echo "short_sha=${SHORT_SHA}"
            echo "backend_image=${BACKEND_IMAGE}"
            echo "frontend_image=${FRONTEND_IMAGE}"
            echo "backend_sha_ref=${BACKEND_IMAGE}:sha-${SHORT_SHA}"
            echo "frontend_sha_ref=${FRONTEND_IMAGE}:sha-${SHORT_SHA}"
          } >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract backend image metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.backend_image }}
          labels: |
            org.opencontainers.image.title=OpsRadar Backend
            org.opencontainers.image.description=FastAPI backend for OpsRadar internal request coordination
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_name == github.event.repository.default_branch }}

      - name: Extract frontend image metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.frontend_image }}
          labels: |
            org.opencontainers.image.title=OpsRadar Frontend
            org.opencontainers.image.description=React frontend for OpsRadar internal request coordination
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_name == github.event.repository.default_branch }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          build-contexts: |
            examples=./docs/examples
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend-publish
          cache-to: type=gha,mode=max,scope=backend-publish

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend-publish
          cache-to: type=gha,mode=max,scope=frontend-publish

      - name: Validate compose with published image refs
        env:
          SECRET_KEY: ci-placeholder-secret-key
          POSTGRES_PASSWORD: ci-placeholder-postgres-password
          REDIS_PASSWORD: ci-placeholder-redis-password
          OPSRADAR_BACKEND_IMAGE: ${{ steps.images.outputs.backend_sha_ref }}
          OPSRADAR_FRONTEND_IMAGE: ${{ steps.images.outputs.frontend_sha_ref }}
        run: docker compose config > /tmp/opsradar.compose.rendered.yml

      - name: Publish image summary
        shell: bash
        run: |
          {
            echo "## Published OpsRadar images"
            echo
            echo "Backend image:"
            echo '```text'
            echo "${{ steps.images.outputs.backend_image }}"
            echo '```'
            echo
            echo "Frontend image:"
            echo '```text'
            echo "${{ steps.images.outputs.frontend_image }}"
            echo '```'
            echo
            echo "SHA-pinned compose refs used for validation:"
            echo '```bash'
            echo "OPSRADAR_BACKEND_IMAGE=${{ steps.images.outputs.backend_sha_ref }}"
            echo "OPSRADAR_FRONTEND_IMAGE=${{ steps.images.outputs.frontend_sha_ref }}"
            echo '```'
            echo
            echo "If the package page is private after the first run, open the package in GitHub → Package settings → Change visibility → Public."
          } >> "${GITHUB_STEP_SUMMARY}"
