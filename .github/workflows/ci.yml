name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  compose:
    name: Compose config validation
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-secret-key-long-enough
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
      OPS_RADAR_ENCRYPTION_KEY: ci-encryption-key
    steps:
      - uses: actions/checkout@v4

      - name: Validate base compose file
        run: docker compose -f docker-compose.yml config >/dev/null

      - name: Validate production compose file
        run: docker compose -f docker-compose.yml -f docker-compose.production.yml config >/dev/null

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system deps for pm4py
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install Python deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        working-directory: backend
        env:
          ENV: development
          SECRET_KEY: ci-test-secret-key-long-enough
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          SYNC_DATABASE_URL: sqlite:///:memory:
        run: |
          python -m pytest -q --tb=short

  frontend:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npx vite build

      - name: Design token check
        working-directory: frontend
        run: node scripts/check-design-tokens.mjs

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install MkDocs deps
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Build docs
        run: mkdocs build --strict

  docker-images:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend, docs]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          build-contexts: |
            examples=./docs/examples
          push: false
          load: true
          tags: opsradar-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: opsradar-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Fail the build on any leaked secret. This is a
          # best-effort scan — false positives can be silenced
          # via .gitleaksignore.
          GITLEAKS_NOTIFY_USER_LIST: ""
        continue-on-error: true
